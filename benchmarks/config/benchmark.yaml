# AxiomESG Benchmark Configuration
# -----------------------------------
# Controls experiment matrix, dataset generation, and evaluation parameters.

dataset:
  synthetic_doc_count: 50
  seed: 42
  output_dir: benchmarks/dataset
  doc_types:
    - pdf_text
    - pdf_scanned
    - docx
    - csv
  # Fraction of docs per type (must sum to 1.0)
  doc_type_weights:
    pdf_text: 0.35
    pdf_scanned: 0.20
    docx: 0.30
    csv: 0.15
  real_docs_dir: benchmarks/dataset/real_docs

variants:
  V0_NO_FILTER_BASELINE:
    label: "No-Filter Baseline (no filter, no weight)"
    filter_on: false
    weight_on: false
    ocr_mode: auto
    awfa_mode: none
    bert_mode: none
    algorithm: passthrough

  V1_NO_FILTER_HEURISTIC_WEIGHT:
    label: "No-Filter Heuristic Weight"
    filter_on: false
    weight_on: true
    ocr_mode: auto
    awfa_mode: heuristic
    bert_mode: none
    algorithm: heuristic

  V2_NO_FILTER_REAL_AWFA_TFIDF:
    label: "No-Filter Real AWFA (TF-IDF + keyword density + Jaccard dedup)"
    filter_on: false
    weight_on: true
    ocr_mode: auto
    awfa_mode: real
    bert_mode: none
    algorithm: real_awfa

  V3_NO_FILTER_MEAN_FUSION:
    label: "No-Filter BERT Mean Fusion"
    filter_on: false
    weight_on: true
    ocr_mode: auto
    awfa_mode: none
    bert_mode: mean
    algorithm: bert_mean

  V4_NO_FILTER_STATIC_FUSION:
    label: "No-Filter BERT Static Fusion"
    filter_on: false
    weight_on: true
    ocr_mode: auto
    awfa_mode: none
    bert_mode: static
    algorithm: bert_static

  V5_NO_FILTER_AWFA_V1:
    label: "No-Filter BERT AWFA v1"
    filter_on: false
    weight_on: true
    ocr_mode: auto
    awfa_mode: none
    bert_mode: awfa_v1
    algorithm: bert_awfa_v1

  V6_NO_FILTER_AWFA_V2:
    label: "No-Filter BERT AWFA v2"
    filter_on: false
    weight_on: true
    ocr_mode: auto
    awfa_mode: none
    bert_mode: awfa_v2
    algorithm: bert_awfa_v2

  V7_NO_FILTER_BERT_ONLY:
    label: "No-Filter BERT Only"
    filter_on: false
    weight_on: true
    ocr_mode: auto
    awfa_mode: none
    bert_mode: static
    algorithm: bert_static

  V8_NO_FILTER_BERT_AWFA_V1:
    label: "No-Filter BERT + AWFA v1"
    filter_on: false
    weight_on: true
    ocr_mode: auto
    awfa_mode: none
    bert_mode: awfa_v1
    algorithm: bert_awfa_v1

  V9_NO_FILTER_BERT_AWFA_V2:
    label: "No-Filter BERT + AWFA v2"
    filter_on: false
    weight_on: true
    ocr_mode: auto
    awfa_mode: none
    bert_mode: awfa_v2
    algorithm: bert_awfa_v2

  V10_NO_FILTER_OCR_FORCE_ON:
    label: "No-Filter BERT AWFA v2 + OCR ON"
    filter_on: false
    weight_on: true
    ocr_mode: force_on
    awfa_mode: none
    bert_mode: awfa_v2
    algorithm: bert_awfa_v2

  V11_NO_FILTER_OCR_FORCE_OFF:
    label: "No-Filter BERT AWFA v2 + OCR OFF"
    filter_on: false
    weight_on: true
    ocr_mode: force_off
    awfa_mode: none
    bert_mode: awfa_v2
    algorithm: bert_awfa_v2

  OLD_V1_FILTER_ONLY:
    label: "Diagnostic: Filter only (no weight)"
    filter_on: true
    weight_on: false
    ocr_mode: auto
    awfa_mode: none
    bert_mode: none
    algorithm: passthrough
    diagnostic_old_filter: true

  OLD_V3_FILTER_HEURISTIC_AWFA:
    label: "Diagnostic: Filter + Heuristic AWFA"
    filter_on: true
    weight_on: true
    ocr_mode: auto
    awfa_mode: heuristic
    bert_mode: none
    algorithm: heuristic
    diagnostic_old_filter: true

  OLD_V10_BERT_AWFA_V2_WITH_FILTER:
    label: "Diagnostic: Filter + BERT AWFA v2"
    filter_on: true
    weight_on: true
    ocr_mode: auto
    awfa_mode: none
    bert_mode: awfa_v2
    algorithm: bert_awfa_v2
    diagnostic_old_filter: true

execution:
  min_scored_runs: 500
  max_augmentation_rounds: 3
  replicas_per_variant_doc: 1
  # If BERT is unavailable, increase doc count to maintain 500+ runs
  auto_scale_docs: true

evaluation:
  relaxed_match:
    normalize_case: true
    normalize_whitespace: true
    normalize_numbers: true   # "245,000" == "245000"
    unit_equivalents:
      - ["tCO2e", "tonnes CO2e", "metric tons CO2e"]
      - ["MWh", "megawatt hours"]
      - ["%", "percent"]
  evidence_k_values: [10, 30, 60]
  jaccard_grounding_threshold: 0.9
  bootstrap_n: 1000
  bootstrap_ci: 0.95

resolution:
  # Thresholds that trigger augmentation
  strict_f1_min: 0.55
  grounded_metric_rate_min: 0.85
  schema_valid_min: 0.95
  augment_doc_count: 20

output:
  results_dir: benchmarks/results
  artifacts_dir: benchmarks/artifacts
  csv_file: axiomesg_benchmark_runs.csv
  report_file: REPORT.md
